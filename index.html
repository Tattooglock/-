const exp=S.expenses.reduce((s,x)=>s+num(x.amount),0),loss=S.stock_log.filter(x=>x.kind=='пошкодження'||x.kind=='списання').reduce((s,x)=>s+num(x.amount),0);
const debt=ok.reduce((s,o)=>s+Math.max(0,num(o.total)+num(o.delivery_cost)-num(o.paid)),0),gross=done.reduce((s,o)=>s+num(o.total)-num(o.cost),0);
return `<div class=kp><div class=c>${T('💸 Дохід')}<b>${money(inc)}</b><span class=m>${done.length} ${T('доставлених')}</span></div><div class=c>${T('✨ Середній чек')}<b>${money(done.length?inc/done.length:0)}</b></div>
<div class=c>${T('🌸 Валовий прибуток')}<b>${money(gross)}</b><span class=m>${T('сума − собівартість')}</span></div><div class=c>${T('🧾 Чистий')}<b>${money(gross-exp-loss)}</b><span class=m>${T('після витрат і втрат')}</span></div>
<div class=c>${T('🥀 Втрати')}<b>${money(loss)}</b></div><div class=c>${T('⏳ Не сплачено')}<b>${money(debt)}</b></div></div>
<div class=row><h3>${T('Витрати')}</h3><button class=btn onclick="edit('expenses')">${T('+ Витрата')}</button></div>
${S.expenses.sort((a,b)=>(b.d||'').localeCompare(a.d||'')).map(x=>`<div class="c row"><span>${x.d} · ${T(x.kind)} <span class=m>${e(x.note)}</span></span><span>${money(x.amount)} <button class="btn s d" onclick="del('expenses','${x.id}')">✕</button></span></div>`).join('')||`<div class=m>${T('Витрат ще немає')}</div>`}`}
/* форма */
function edit(t,id,pre){const r=id?S[t].find(x=>x.id==id):(pre||{});
const f=F[t].map(([k,l,ty])=>{let v=r[k]??'';ty=ty||'text';let i;
if(ty=='client')i=`<input id=cs value="${e(v?cname(v):'')}" placeholder="${T("🔍 Ім'я чи телефон клієнта")}" autocomplete=off oninput="fcl(this.value,1)" onfocus="fcl(this.value)"><input type=hidden id=f_client_id value="${e(v)}"><div id=cl></div>`;
else if(ty.startsWith('sel:'))i=`<select id=f_${k}>${ty.slice(4).split(',').map(o=>`<option value="${o}" ${o==v?'selected':''}>${T(o)}</option>`).join('')}</select>`;
else if(ty=='area')i=`<textarea id=f_${k} rows=2>${e(v)}</textarea>`;
else i=`<input id=f_${k} type="${ty}" value="${e(v)}" ${k=='address'?'list=adl':''}>`;
const sp=(t=='orders'&&['d','t_from','t_to'].includes(k))?2:(SP[k]||((ty=='number'||ty=='date')?3:6));
return `<div style="grid-column:span ${sp}"><label>${T(l)}</label>${i}</div>`}).join('');
$('#mb').innerHTML=`<b>${T(id?'Редагувати':'Нове')}</b><div class=fg>${f}</div><datalist id=adl>${[...new Set(S.orders.map(o=>o.address).filter(Boolean))].map(a=>`<option value="${e(a)}">`).join('')}</datalist><div class=row><button class=btn onclick="save('${t}','${id||''}')">${T('Зберегти')}</button><button class="btn s" onclick="closeM()">${T('Скасувати')}</button></div>`;$('#modal').style.display='block'}
function fcl(v,clear){if(clear)$('#f_client_id').value='';const s=v.toLowerCase();
const l=S.clients.filter(c=>(c.name+' '+(c.phone||'')+' '+(c.instagram||'')).toLowerCase().includes(s)).slice(0,8);
$('#cl').innerHTML=l.length?l.map(c=>`<div class=opt onclick="pick('${c.id}')">${e(c.name)} <span class=m>${e(c.phone||'')}</span></div>`).join(''):`<div class=m>${T('Нічого не знайдено')}</div>`}
function pick(id){const c=S.clients.find(x=>x.id==id);$('#f_client_id').value=id;$('#cs').value=c.name;$('#cl').innerHTML='';const a=$('#f_address');if(a&&!a.value)a.value=c.address||''}
function closeM(){$('#modal').style.display='none'}
async function save(t,id){const o={};F[t].forEach(([k,,ty])=>{let v=$('#f_'+k).value;o[k]=v===''?null:(ty=='number'?+v:v)});
if(t=='orders'&&!o.client_id){alert(T('Обери клієнта'));return}
let r=id?await sb.from(t).update(o).eq('id',id).select().single():await sb.from(t).insert(o).select().single();
if(r.error){alert(r.error.message);return}
if(t=='orders')await autoWriteOff(r.data);
closeM();load()}
async function del(t,id){if(confirm(T('Видалити?'))){await sb.from(t).delete().eq('id',id);load()}}
/* замовлення */
function copyOrder(id){const o=S.orders.find(x=>x.id==id),c={...o};['id','num','created_at','written_off','cost','paid'].forEach(k=>delete c[k]);c.status='нове';c.pay_status='не оплачено';c.d=null;edit('orders',null,c)}
function newFor(cid){edit('orders',null,{client_id:cid,status:'нове',address:(S.clients.find(c=>c.id==cid)||{}).address})}
function repeat(cid){const l=S.orders.filter(o=>o.client_id==cid).sort((a,b)=>b.created_at.localeCompare(a.created_at));l[0]?copyOrder(l[0].id):alert(T('У клієнта ще немає замовлень'))}
/* автосписання */
async function autoWriteOff(o){if(o.status!='доставлене'||o.written_off)return;let cost=0;
for(const p of (o.items||'').split(',')){const [n,q]=p.split(':');if(!n||!q)continue;const s=S.stock.filter(x=>x.name.toLowerCase()==n.trim().toLowerCase()).sort((a,b)=>(a.expires||'9').localeCompare(b.expires||'9'))[0];if(!s)continue;
const qty=+q,amt=qty*num(s.price);cost+=amt;await sb.from('stock').update({qty:num(s.qty)-qty}).eq('id',s.id);await sb.from('stock_log').insert({stock_id:s.id,kind:'замовлення',qty,amount:amt,note:'№'+o.num});s.qty=num(s.qty)-qty}
await sb.from('orders').update({written_off:true,cost}).eq('id',o.id)}
/* склад */
async function move(id,kind){const s=S.stock.find(x=>x.id==id);const v=prompt(kind=='інвентаризація'?T('Фактичний залишок:'):T('Кількість')+' ('+T(s.unit)+'):');if(v===null||v==='')return;const n=+v;let qty=num(s.qty),amt=0,logq=n;
if(kind=='надходження'){qty+=n;const p=prompt(T('Закупівельна ціна за од. (залиш порожнім — без змін):'));const up={qty,received:iso(new Date())};if(p)up.price=+p;const d=prompt(T('Свіжі до (РРРР-ММ-ДД, можна пропустити):'));if(d)up.expires=d;await sb.from('stock').update(up).eq('id',id)}
else if(kind=='інвентаризація'){logq=n-qty;amt=logq<0?-logq*num(s.price):0;await sb.from('stock').update({qty:n}).eq('id',id)}
else{qty-=n;amt=n*num(s.price);await sb.from('stock').update({qty}).eq('id',id)}
await sb.from('stock_log').insert({stock_id:id,kind,qty:logq,amount:amt});load()}
init();
</script></body></html>
